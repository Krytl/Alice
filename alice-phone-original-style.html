      <p style="margin:16px 0 2px;font-size:13px;opacity:.85">ยอดเงินที่ใช้ได้</p>
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:32px;font-weight:600">${bankHide ? "฿ ••••••" : "฿ " + baht(b.balance)}</span><button data-act="bankeye" style="font-size:20px">${bankHide ? "🙈" : "👁"}</button></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 18px">${act("💸","โอนเงิน")}${act("📷","สแกนจ่าย")}${act("📱","เติมเงิน")}${act("🧾","จ่ายบิล")}</div>
    <div style="margin:0 14px 14px;padding:16px;border-radius:18px;background:var(--card)"><b>MGI Rewards</b><p style="margin-top:4px;font-size:13px;color:var(--sub)">แต้มสะสมของคุณ 1,240 แต้ม แลกส่วนลดได้เลย</p></div>
    <div style="margin:0 14px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#2a1738,#4a2a6e)"><b>สมัครบัตรเดบิตใบใหม่</b><p style="margin-top:4px;font-size:13px;color:var(--sub)">ไม่มีค่าธรรมเนียมรายปี</p></div>`,
    "home",
    `<div style="position:absolute;bottom:0;left:0;right:0;display:flex;padding:10px 6px calc(env(safe-area-inset-bottom,0px) + 22px);background:#1a1228;border-top:1px solid #33284a">${tab("🏠","หน้าหลัก",1)}${tab("💳","บัญชี")}${tab("⬛","สแกน")}${tab("🧾","บริการ")}${tab("☰","เพิ่มเติม")}</div>`);
}
function searchApp() {
  show("Safari", `<div style="margin:6px 14px 14px;padding:12px 16px;border-radius:22px;background:var(--card);color:var(--sub);font-size:14px">🔍 ค้นหาหรือป้อนที่อยู่เว็บ</div><p style="padding:0 18px 4px;color:var(--sub);font-size:13px">ประวัติการค้นหา</p>` +
    SEARCHES.map(s => `<div class="li"><span style="font-size:18px;flex:none">🕘</span><div class="m"><b style="font-weight:400">${s.q}</b><small>${s.w}</small></div></div>`).join(""));
}
const closeApp = () => $("#app").classList.remove("on");

/* ปลดล็อก */
let pin = "";
const L = C.passcode.length;
$("#pad").innerHTML = [1,2,3,4,5,6,7,8,9,0].map(k => `<button data-act="key" data-v="${k}" ${k === 0 ? 'class="z"' : ""}>${k}</button>`).join("");
const dots = () => $("#dots").innerHTML = Array.from({ length: L }, (_, i) => `<i class="${i < pin.length ? "f" : ""}"></i>`).join("");
dots();
function key(k) {
  if (pin.length >= L) return; pin += k; dots();
  if (pin.length === L) setTimeout(() => {
    if (pin === C.passcode) { $("#pass").classList.remove("on"); $("#lock").classList.add("up"); pin = ""; dots(); }
    else { $("#dots").classList.add("shake"); $("#ptitle").textContent = "ยังไม่ถูก… ลองใหม่";
      setTimeout(() => { $("#dots").classList.remove("shake"); pin = ""; dots(); }, 400); }
  }, 120);
}
const openPass = () => { $("#pass").classList.add("on"); $("#ptitle").textContent = "ใส่รหัสผ่าน"; pin = ""; dots(); };
document.addEventListener("keydown", e => { if ($("#pass").classList.contains("on") && /^\d$/.test(e.key)) key(e.key); });
let y0 = null;
$("#lock").addEventListener("touchstart", e => y0 = e.touches[0].clientY, { passive: true });
$("#lock").addEventListener("touchend", e => { if (y0 !== null && y0 - e.changedTouches[0].clientY > 60) openPass(); y0 = null; });

$(".phone").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "pass") openPass(); else if (a === "cancel") $("#pass").classList.remove("on");
  else if (a === "key") key(v); else if (a === "app") openApp(v); else if (a === "home") closeApp();
  else if (a === "lines") lineList(); else if (a === "chat") lineChat(+v); else if (a === "send") send(+v);
 else if (a === "photo") photoView(+v); else if (a === "photoback") openApp("photos");
   else if (a === "bankeye") { bankHide = !bankHide; openApp("bank"); }
 else if (a === "igpost") igPost(+v); else if (a === "igback") openApp("ig");
  else if (a === "note") noteOpen(+v); else if (a === "notelist") noteList();
  else if (a === "alarm") { C.alarms[v].on ^= 1; openApp("clock"); }
});
</script>
</body>
</html>
